<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Admin Dashboard</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">


    <!-- Custom CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- =====================================================
     ADMIN SIDEBAR
===================================================== -->

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">


    <div class="container-fluid p-4">


        <!-- HEADER -->

        <div class="mb-4">

            <h2 class="fw-bold">

                Welcome,

                <span
                        class="text-primary"
                        th:text="${userName}">
                    Admin
                </span>

            </h2>


            <p class="text-muted">

                Admin Dashboard

                <span
                        class="badge bg-dark"
                        th:text="${userRole}">
                    ADMIN
                </span>

            </p>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div
                th:if="${param.approved}"
                class="alert alert-success alert-dismissible fade show">

            <i class="bi bi-check-circle-fill"></i>

            <strong>
                Success!
            </strong>

            Quotation approved successfully.

            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- DASHBOARD SUMMARY -->

        <div class="row g-4">


            <!-- RFT -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <i
                                class="bi bi-file-earmark-text fs-1 text-primary">
                        </i>


                        <h5 class="mt-3">

                            RFT Management

                        </h5>


                        <p class="text-muted">

                            Manage Request For Quotations.

                        </p>

                    </div>

                </div>

            </div>


            <!-- USERS -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <i
                                class="bi bi-people fs-1 text-success">
                        </i>


                        <h5 class="mt-3">

                            User Management

                        </h5>


                        <p class="text-muted">

                            Manage Admins and Vendors.

                        </p>

                    </div>

                </div>

            </div>


            <!-- QUOTATIONS -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <i
                                class="bi bi-receipt fs-1 text-warning">
                        </i>


                        <h5 class="mt-3">

                            Quotations

                        </h5>


                        <p class="text-muted">

                            Review and approve vendor quotations.

                        </p>

                    </div>

                </div>

            </div>


        </div>

    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div th:replace="~{fragments/footer :: footer}">
</div>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
