<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Setup New Authenticator</title>


    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">


                    <!-- ===================================== -->
                    <!-- HEADER -->
                    <!-- ===================================== -->

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Setup New Authenticator
                        </h2>

                        <p class="text-muted mb-0">
                            Your previous authenticator has been
                            replaced.
                        </p>

                    </div>


                    <!-- ===================================== -->
                    <!-- ACCOUNT EMAIL -->
                    <!-- ===================================== -->

                    <div class="text-center mb-4">

                        <small class="text-muted">
                            Account
                        </small>

                        <div
                                id="loginEmail"
                                class="fw-semibold">
                        </div>

                    </div>


                    <!-- ===================================== -->
                    <!-- INFORMATION -->
                    <!-- ===================================== -->

                    <div class="alert alert-info">

                        <strong>Step 1:</strong>
                        Open Google Authenticator.

                        <br>

                        <strong>Step 2:</strong>
                        Scan the QR code below.

                        <br>

                        <strong>Step 3:</strong>
                        Enter the 6-digit code generated
                        by Google Authenticator.

                    </div>


                    <!-- ===================================== -->
                    <!-- QR CODE -->
                    <!-- ===================================== -->

                    <div class="text-center mb-4">

                        <div
                                id="qrCode"
                                class="d-flex justify-content-center">
                        </div>

                    </div>


                    <!-- ===================================== -->
                    <!-- ERROR MESSAGE -->
                    <!-- ===================================== -->

                    <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                            role="alert">
                    </div>


                    <!-- ===================================== -->
                    <!-- SUCCESS MESSAGE -->
                    <!-- ===================================== -->

                    <div
                            id="successMessage"
                            class="alert alert-success d-none"
                            role="alert">
                    </div>


                    <!-- ===================================== -->
                    <!-- OTP FORM -->
                    <!-- ===================================== -->

                    <form id="recoveryTwoFactorForm">


                        <div class="mb-3">

                            <label
                                    for="code"
                                    class="form-label fw-semibold">

                                Google Authenticator Code

                            </label>

                            <input
                                    type="text"
                                    id="code"
                                    name="code"
                                    class="form-control form-control-lg text-center"
                                    maxlength="6"
                                    minlength="6"
                                    inputmode="numeric"
                                    autocomplete="one-time-code"
                                    placeholder="000000"
                                    required>

                            <div class="form-text text-center">

                                Enter the current 6-digit code
                                from Google Authenticator.

                            </div>

                        </div>


                        <!-- ================================= -->
                        <!-- VERIFY BUTTON -->
                        <!-- ================================= -->

                        <div class="d-grid">

                            <button
                                    type="submit"
                                    id="verifyButton"
                                    class="btn btn-primary btn-lg">

                                Verify & Continue

                            </button>

                        </div>

                    </form>


                    <!-- ===================================== -->
                    <!-- BACK TO LOGIN -->
                    <!-- ===================================== -->

                    <div class="text-center mt-4">

                        <a
                                th:href="@{/login}"
                                class="text-decoration-none text-muted">

                            ← Back to Login

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- ========================================= -->
<!-- Bootstrap JS -->
<!-- ========================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ========================================= -->
<!-- QR Code Library -->
<!-- ========================================= -->

<script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<!-- ========================================= -->
<!-- Recovery 2FA JS -->
<!-- ========================================= -->

<script
        th:src="@{/js/recovery-2fa.js}">
</script>


</body>

</html>
