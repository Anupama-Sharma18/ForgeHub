<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Create RFT</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">


    <!-- =====================================================
         YOUR COMMON CSS
    ====================================================== -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">


    <style>

        body {
            background: #f4f6f9;
        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .main-content {
            margin-left: 260px;
            min-height: calc(100vh - 60px);
        }


        /* =========================================
           MAIN CARD
        ========================================== */

        .rft-card {
            border: none;
            border-radius: 12px;
        }


        /* =========================================
           STEP NAVIGATION
        ========================================== */

        .step-navigation {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 20px;
        }


        .step-btn {
            border: none;
            background: transparent;
            width: 100%;
            color: #6c757d;
        }


        .step-circle {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: auto;

            border-radius: 50%;

            background: #dee2e6;

            color: #495057;

            font-weight: bold;

            font-size: 18px;
        }


        .step-title {
            margin-top: 8px;

            font-size: 14px;

            font-weight: 600;
        }


        .step-btn.active .step-circle {
            background: #0d6efd;
            color: white;
        }


        .step-btn.active .step-title {
            color: #0d6efd;
        }


        .step-btn.completed .step-circle {
            background: #198754;
            color: white;
        }


        /* =========================================
           FORM SECTIONS
        ========================================== */

        .form-step {
            display: none;
        }


        .form-step.active {
            display: block;
        }


        .section-title {
            border-bottom: 1px solid #dee2e6;

            padding-bottom: 10px;

            margin-bottom: 25px;
        }


        /* =========================================
           ITEM CARD
        ========================================== */

        .item-card {

            background: #f8f9fa;

            border: 1px solid #dee2e6;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 15px;

        }


        /* =========================================
           VENDOR CARD
        ========================================== */

        .vendor-card {

            border: 1px solid #dee2e6;

            border-radius: 8px;

            padding: 15px;

            height: 100%;

            transition: 0.2s;

        }


        .vendor-card:hover {

            background: #f8f9fa;

            border-color: #0d6efd;

        }


        /* =========================================
           STEP FOOTER
        ========================================== */

        .step-footer {

            border-top: 1px solid #dee2e6;

            padding-top: 20px;

            margin-top: 30px;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .main-content {

                margin-left: 0;

            }

            .step-title {

                font-size: 11px;

            }

            .step-circle {

                width: 38px;

                height: 38px;

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- =====================================================
     ADMIN SIDEBAR
===================================================== -->

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">


    <div class="container-fluid py-4">


        <!-- =================================================
             MAIN CARD
        ================================================== -->

        <div class="card rft-card shadow-sm">


            <div class="card-body p-4 p-md-5">


                <!-- =================================================
                     PAGE TITLE
                ================================================== -->

                <div class="mb-4">

                    <h2 class="fw-bold text-primary">

                        <i class="bi bi-file-earmark-plus"></i>

                        Create Request For Quotation

                    </h2>

                    <p class="text-muted">

                        Create RFT in three simple steps.

                    </p>

                </div>


                <!-- =================================================
                     SUCCESS MESSAGE
                ================================================== -->

                <div
                        th:if="${successMessage}"
                        class="alert alert-success alert-dismissible fade show">

                    <i class="bi bi-check-circle-fill"></i>

                    <span th:text="${successMessage}">
                    </span>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>


                <!-- =================================================
                     ERROR MESSAGE
                ================================================== -->

                <div
                        th:if="${errorMessage}"
                        class="alert alert-danger alert-dismissible fade show">

                    <i class="bi bi-exclamation-triangle-fill"></i>

                    <span th:text="${errorMessage}">
                    </span>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>


                <!-- =================================================
                     STEP NAVIGATION
                ================================================== -->

                <div class="row step-navigation mb-4">


                    <!-- STEP 1 -->

                    <div class="col-4">

                        <button
                                type="button"
                                class="step-btn active"
                                onclick="showStep(1)">

                            <div class="step-circle">

                                1

                            </div>

                            <div class="step-title">

                                RFT BID DETAILS

                            </div>

                        </button>

                    </div>


                    <!-- STEP 2 -->

                    <div class="col-4">

                        <button
                                type="button"
                                class="step-btn"
                                onclick="showStep(2)">

                            <div class="step-circle">

                                2

                            </div>

                            <div class="step-title">

                                BID ITEMS

                            </div>

                        </button>

                    </div>


                    <!-- STEP 3 -->

                    <div class="col-4">

                        <button
                                type="button"
                                class="step-btn"
                                onclick="showStep(3)">

                            <div class="step-circle">

                                3

                            </div>

                            <div class="step-title">

                                DURATION & VENDORS

                            </div>

                        </button>

                    </div>


                </div>


                <!-- =================================================
                     MAIN FORM
                ================================================== -->

                <form
                        th:action="@{/rft/create}"
                        th:object="${rftRequestDTO}"
                        method="post">


                    <!-- =================================================
                         STEP 1
                    ================================================== -->

                    <div
                            id="step1"
                            class="form-step active">


                        <h5 class="section-title">

                            <i class="bi bi-file-earmark-text"></i>

                            RFT BID DETAILS

                        </h5>


                        <div class="row">


                            <!-- DESCRIPTION -->

                            <div class="col-md-6 mb-4">

                                <label
                                        for="description"
                                        class="form-label fw-semibold">

                                    Description

                                </label>


                                <textarea
                                        id="description"
                                        class="form-control"
                                        th:field="*{description}"
                                        rows="5"
                                        placeholder="Enter RFT description"
                                        required>
                                </textarea>

                            </div>


                            <!-- DELIVERY LOCATION -->

                            <div class="col-md-6 mb-4">

                                <label
                                        for="deliveryLocation"
                                        class="form-label fw-semibold">

                                    Delivery Location

                                </label>


                                <input
                                        type="text"
                                        id="deliveryLocation"
                                        class="form-control"
                                        th:field="*{deliveryLocation}"
                                        placeholder="Enter delivery location"
                                        required>

                            </div>


                        </div>


                        <!-- NEXT -->

                        <div class="step-footer d-flex justify-content-end">

                            <button
                                    type="button"
                                    class="btn btn-primary px-4"
                                    onclick="showStep(2)">

                                Next

                                <i class="bi bi-arrow-right"></i>

                            </button>

                        </div>


                    </div>


                    <!-- =================================================
                         STEP 2
                    ================================================== -->

                    <div
                            id="step2"
                            class="form-step">


                        <h5 class="section-title">

                            <i class="bi bi-list-check"></i>

                            BID ITEMS

                        </h5>


                        <!-- ITEMS -->

                        <div id="itemsContainer">


                            <!-- FIRST ITEM -->

                            <div class="item-card">


                                <div class="row">


                                    <!-- LINE NO -->

                                    <div class="col-md-2 mb-3">

                                        <label class="form-label fw-semibold">

                                            Line No

                                        </label>


                                        <input
                                                type="number"
                                                name="items[0].lineNo"
                                                class="form-control"
                                                value="1"
                                                readonly>

                                    </div>


                                    <!-- ITEM NO -->

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label fw-semibold">

                                            Item No

                                        </label>


                                        <input
                                                type="text"
                                                name="items[0].itemNo"
                                                class="form-control"
                                                placeholder="Enter item number"
                                                required>

                                    </div>


                                    <!-- ITEM NAME -->

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label fw-semibold">

                                            Item Name

                                        </label>


                                        <input
                                                type="text"
                                                name="items[0].itemName"
                                                class="form-control"
                                                placeholder="Enter item name"
                                                required>

                                    </div>


                                    <!-- QUANTITY -->

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label fw-semibold">

                                            Required Quantity

                                        </label>


                                        <input
                                                type="number"
                                                step="0.001"
                                                name="items[0].requiredQuantity"
                                                class="form-control"
                                                placeholder="Enter quantity"
                                                required>

                                    </div>


                                    <!-- UOM -->

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label fw-semibold">

                                            UOM

                                        </label>


                                        <input
                                                type="text"
                                                name="items[0].uom"
                                                class="form-control"
                                                placeholder="KG / NOS / MTR"
                                                required>

                                    </div>


                                    <!-- DELIVERY DATE -->

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label fw-semibold">

                                            Required Delivery Date

                                        </label>


                                        <input
                                                type="datetime-local"
                                                name="items[0].requiredDeliveryDate"
                                                class="form-control"
                                                required>

                                    </div>


                                    <!-- DELIVERY LOCATION -->

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label fw-semibold">

                                            Delivery Location

                                        </label>


                                        <input
                                                type="text"
                                                name="items[0].deliveryLocation"
                                                class="form-control"
                                                placeholder="Enter location">

                                    </div>


                                    <!-- FACTORY CODE -->

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label fw-semibold">

                                            Factory Code

                                        </label>


                                        <input
                                                type="text"
                                                name="items[0].factoryCode"
                                                class="form-control"
                                                placeholder="Enter factory code">

                                    </div>


                                    <!-- DESCRIPTION -->

                                    <div class="col-md-12 mb-3">

                                        <label class="form-label fw-semibold">

                                            Item Description

                                        </label>


                                        <textarea
                                                name="items[0].description"
                                                class="form-control"
                                                rows="2"
                                                placeholder="Enter item description">
                                        </textarea>

                                    </div>


                                </div>


                            </div>


                        </div>


                        <!-- ADD ITEM -->

                        <button
                                type="button"
                                class="btn btn-outline-primary"
                                onclick="addItem()">

                            <i class="bi bi-plus-circle"></i>

                            Add Item

                        </button>


                        <!-- NAVIGATION -->

                        <div class="step-footer d-flex justify-content-between">


                            <button
                                    type="button"
                                    class="btn btn-secondary"
                                    onclick="showStep(1)">

                                <i class="bi bi-arrow-left"></i>

                                Previous

                            </button>


                            <button
                                    type="button"
                                    class="btn btn-primary"
                                    onclick="showStep(3)">

                                Next

                                <i class="bi bi-arrow-right"></i>

                            </button>


                        </div>


                    </div>


                    <!-- =================================================
                         STEP 3
                    ================================================== -->

                    <div
                            id="step3"
                            class="form-step">


                        <h5 class="section-title">

                            <i class="bi bi-calendar-check"></i>

                            DURATION AND VENDORS

                        </h5>


                        <!-- DATES -->

                        <div class="row">


                            <!-- START DATE -->

                            <div class="col-md-6 mb-4">

                                <label
                                        for="bidDate"
                                        class="form-label fw-semibold">

                                    Bid Start Date

                                </label>


                                <input
                                        type="datetime-local"
                                        id="bidDate"
                                        class="form-control"
                                        th:field="*{bidDate}"
                                        required>

                            </div>


                            <!-- END DATE -->

                            <div class="col-md-6 mb-4">

                                <label
                                        for="expiryDate"
                                        class="form-label fw-semibold">

                                    Bid End Date

                                </label>


                                <input
                                        type="datetime-local"
                                        id="expiryDate"
                                        class="form-control"
                                        th:field="*{expiryDate}"
                                        required>

                            </div>


                        </div>


                        <!-- =================================================
                             VENDORS
                        ================================================== -->

                        <div class="mt-3">


                            <label class="form-label fw-bold">

                                <i class="bi bi-people"></i>

                                Select Vendors

                            </label>


                            <div class="row">


                                <!-- VENDOR -->

                                <div
                                        class="col-md-6 col-lg-4 mb-3"
                                        th:each="vendor : ${vendors}">


                                    <div class="vendor-card">


                                        <div class="form-check">


                                            <input
                                                    class="form-check-input"
                                                    type="checkbox"
                                                    name="vendorIds"
                                                    th:value="${vendor.id}"
                                                    th:id="'vendor_' + ${vendor.id}">


                                            <label
                                                    class="form-check-label"
                                                    th:for="'vendor_' + ${vendor.id}">


                                                <span
                                                        class="fw-bold"
                                                        th:text="${vendor.fullName}">

                                                </span>


                                                <br>


                                                <small class="text-muted">

                                                    <span
                                                            th:text="${vendor.companyName}">
                                                    </span>

                                                </small>


                                                <br>


                                                <small class="text-muted">

                                                    Mobile:

                                                    <span
                                                            th:text="${vendor.mobileNo}">
                                                    </span>

                                                </small>


                                            </label>


                                        </div>


                                    </div>


                                </div>


                                <!-- NO VENDORS -->

                                <div
                                        class="col-12"
                                        th:if="${#lists.isEmpty(vendors)}">


                                    <div class="alert alert-warning">

                                        <i class="bi bi-exclamation-triangle"></i>

                                        No vendors available.

                                    </div>


                                </div>


                            </div>


                        </div>


                        <!-- =================================================
                             NAVIGATION
                        ================================================== -->

                        <div class="step-footer d-flex justify-content-between">


                            <button
                                    type="button"
                                    class="btn btn-secondary"
                                    onclick="showStep(2)">

                                <i class="bi bi-arrow-left"></i>

                                Previous

                            </button>


                            <button
                                    type="submit"
                                    class="btn btn-success px-5">

                                <i class="bi bi-check-circle"></i>

                                Submit RFT

                            </button>


                        </div>


                    </div>


                </form>


            </div>


        </div>


    </div>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div th:replace="~{fragments/footer :: footer}">
</div>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     STEP JAVASCRIPT
===================================================== -->

<script>


    let currentStep = 1;


    function showStep(step) {


        currentStep = step;


        /* -----------------------------------------
           HIDE ALL STEPS
        ------------------------------------------ */

        document
            .querySelectorAll(".form-step")
            .forEach(function(element) {

                element.classList.remove("active");

            });


        /* -----------------------------------------
           SHOW SELECTED STEP
        ------------------------------------------ */

        document
            .getElementById("step" + step)
            .classList.add("active");


        /* -----------------------------------------
           UPDATE STEP BUTTONS
        ------------------------------------------ */

        document
            .querySelectorAll(".step-btn")
            .forEach(function(button, index) {


                button.classList.remove("active");

                button.classList.remove("completed");


                let buttonStep = index + 1;


                if (buttonStep === step) {

                    button.classList.add("active");

                }


                if (buttonStep < step) {

                    button.classList.add("completed");

                }

            });


        /* -----------------------------------------
           SCROLL TOP
        ------------------------------------------ */

        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    /* =================================================
       ADD ITEM
    ================================================== */

    let itemIndex = 1;


    function addItem() {


        const container =
            document.getElementById("itemsContainer");


        const item =
            document.createElement("div");


        item.className =
            "item-card";


        item.innerHTML = `

            <div class="row">

                <div class="col-md-2 mb-3">

                    <label class="form-label fw-semibold">
                        Line No
                    </label>

                    <input
                        type="number"
                        name="items[${itemIndex}].lineNo"
                        class="form-control"
                        value="${itemIndex + 1}"
                        readonly>

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        Item No
                    </label>

                    <input
                        type="text"
                        name="items[${itemIndex}].itemNo"
                        class="form-control"
                        placeholder="Enter item number"
                        required>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Item Name
                    </label>

                    <input
                        type="text"
                        name="items[${itemIndex}].itemName"
                        class="form-control"
                        placeholder="Enter item name"
                        required>

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        Required Quantity
                    </label>

                    <input
                        type="number"
                        step="0.001"
                        name="items[${itemIndex}].requiredQuantity"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        UOM
                    </label>

                    <input
                        type="text"
                        name="items[${itemIndex}].uom"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label fw-semibold">
                        Required Delivery Date
                    </label>

                    <input
                        type="datetime-local"
                        name="items[${itemIndex}].requiredDeliveryDate"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Delivery Location
                    </label>

                    <input
                        type="text"
                        name="items[${itemIndex}].deliveryLocation"
                        class="form-control">

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Factory Code
                    </label>

                    <input
                        type="text"
                        name="items[${itemIndex}].factoryCode"
                        class="form-control">

                </div>


                <div class="col-md-12 mb-3">

                    <label class="form-label fw-semibold">
                        Item Description
                    </label>

                    <textarea
                        name="items[${itemIndex}].description"
                        class="form-control"
                        rows="2">
                    </textarea>

                </div>


                <div class="col-md-12">

                    <button
                        type="button"
                        class="btn btn-sm btn-danger"
                        onclick="this.closest('.item-card').remove()">

                        <i class="bi bi-trash"></i>

                        Remove Item

                    </button>

                </div>

            </div>

        `;


        container.appendChild(item);


        itemIndex++;

    }

</script>


</body>

</html>
