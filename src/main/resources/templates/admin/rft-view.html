<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Edit RFT</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">


    <!-- Existing Common CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- =====================================================
     ADMIN SIDEBAR
===================================================== -->

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">


    <div class="container-fluid py-4 px-4">


        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div
                class="d-flex
                       justify-content-between
                       align-items-center
                       flex-wrap
                       gap-3
                       mb-4">


            <div>

                <h2 class="fw-bold text-primary mb-1">

                    <i class="bi bi-pencil-square me-2"></i>

                    Edit RFT

                </h2>


                <p class="text-muted mb-0">

                    Update Request For Quotation details

                </p>

            </div>


            <!-- BACK -->

            <a
                    th:href="@{/rft/list}"
                    class="btn btn-secondary">

                <i class="bi bi-arrow-left me-1"></i>

                Back to RFT List

            </a>


        </div>


        <!-- =================================================
             ERROR MESSAGE
        ================================================== -->

        <div
                th:if="${errorMessage}"
                class="alert alert-danger alert-dismissible fade show"
                role="alert">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>

            <span th:text="${errorMessage}">
                Error
            </span>


            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- =================================================
             MAIN CARD
        ================================================== -->

        <div class="card shadow-sm border-0">


            <!-- CARD HEADER -->

            <div class="card-header bg-primary text-white py-3">

                <h5 class="mb-0">

                    <i class="bi bi-file-earmark-text me-2"></i>

                    Request For Quotation Information

                </h5>

            </div>


            <!-- CARD BODY -->

            <div class="card-body p-4">


                <!-- =================================================
                     RFT NUMBER / INDENT NUMBER
                ================================================== -->

                <div class="row g-3 mb-4">


                    <!-- RFT NUMBER -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            RFT Number

                        </label>


                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-hash"></i>

                            </span>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:value="${rft.rftNo}"
                                    readonly>

                        </div>

                    </div>


                    <!-- INDENT NUMBER -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Indent Number

                        </label>


                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-file-earmark"></i>

                            </span>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:value="${rft.indentNo}"
                                    readonly>

                        </div>

                    </div>


                </div>


                <hr class="mb-4">


                <!-- =================================================
                     UPDATE FORM
                ================================================== -->

                <form
                        th:action="@{/rft/update/{id}(id=${rft.rftId})}"
                        method="post">


                    <!-- =================================================
                         DESCRIPTION
                    ================================================== -->

                    <div class="mb-4">


                        <label
                                for="description"
                                class="form-label fw-semibold">

                            Description

                        </label>


                        <textarea
                                id="description"
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter RFT description"
                                required
                                th:text="${rft.description}">
                        </textarea>


                    </div>


                    <!-- =================================================
                         DELIVERY LOCATION
                    ================================================== -->

                    <div class="mb-4">


                        <label
                                for="deliveryLocation"
                                class="form-label fw-semibold">

                            Delivery Location

                        </label>


                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-geo-alt"></i>

                            </span>


                            <input
                                    type="text"
                                    id="deliveryLocation"
                                    name="deliveryLocation"
                                    class="form-control"
                                    placeholder="Enter delivery location"
                                    th:value="${rft.deliveryLocation}"
                                    required>

                        </div>


                    </div>


                    <!-- =================================================
                         BID DATE / EXPIRY DATE
                    ================================================== -->

                    <div class="row g-3 mb-4">


                        <!-- BID DATE -->

                        <div class="col-md-6">


                            <label
                                    for="bidDate"
                                    class="form-label fw-semibold">

                                Bid Date

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-calendar-event"></i>

                                </span>


                                <input
                                        type="datetime-local"
                                        id="bidDate"
                                        name="bidDate"
                                        class="form-control"
                                        th:value="${rft.bidDate != null ? #temporals.format(rft.bidDate, 'yyyy-MM-dd''T''HH:mm') : ''}">

                            </div>


                        </div>


                        <!-- EXPIRY DATE -->

                        <div class="col-md-6">


                            <label
                                    for="expiryDate"
                                    class="form-label fw-semibold">

                                Expiry Date

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-calendar-x"></i>

                                </span>


                                <input
                                        type="datetime-local"
                                        id="expiryDate"
                                        name="expiryDate"
                                        class="form-control"
                                        th:value="${rft.expiryDate != null ? #temporals.format(rft.expiryDate, 'yyyy-MM-dd''T''HH:mm') : ''}">

                            </div>


                        </div>


                    </div>


                    <!-- =================================================
                         STATUS
                    ================================================== -->

                    <div class="mb-4">


                        <label
                                for="status"
                                class="form-label fw-semibold">

                            Status

                        </label>


                        <select
                                id="status"
                                name="status"
                                class="form-select">


                            <option
                                    value="DRAFT"
                                    th:selected="${rft.status == 'DRAFT'}">

                                DRAFT

                            </option>


                            <option
                                    value="OPEN"
                                    th:selected="${rft.status == 'OPEN'}">

                                OPEN

                            </option>


                            <option
                                    value="CLOSE"
                                    th:selected="${rft.status == 'CLOSE'}">

                                CLOSE

                            </option>


                        </select>


                    </div>


                    <!-- =================================================
                         BUTTONS
                    ================================================== -->

                    <div
                            class="d-flex
                                   justify-content-end
                                   gap-2
                                   pt-3
                                   border-top">


                        <!-- CANCEL -->

                        <a
                                th:href="@{/rft/list}"
                                class="btn btn-secondary">

                            <i class="bi bi-x-circle me-1"></i>

                            Cancel

                        </a>


                        <!-- UPDATE -->

                        <button
                                type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-check-circle me-1"></i>

                            Update RFT

                        </button>


                    </div>


                </form>


            </div>

        </div>


    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div th:replace="~{fragments/footer :: footer}">
</div>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
