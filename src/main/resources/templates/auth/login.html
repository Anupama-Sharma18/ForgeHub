<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ForgeHub - Login</title>


    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Custom CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body>

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        ForgeHub Login
                    </h2>


                    <!-- Login Form -->
                    <form id="loginForm">


                        <!-- Email -->
                        <div class="mb-3">

                            <label
                                    for="email"
                                    class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter email"
                                    required>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label
                                    for="password"
                                    class="form-label">
                                Password
                            </label>

                            <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    required>

                        </div>


                        <!-- Error Message -->
                        <div
                                id="errorMessage"
                                class="alert alert-danger d-none">
                        </div>


                        <!-- Success Message -->
                        <div
                                id="successMessage"
                                class="alert alert-success d-none">
                        </div>


                        <!-- Login Button -->
                        <button
                                type="submit"
                                id="loginButton"
                                class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Your JavaScript -->
<script
        th:src="@{/js/login.js}">
</script>

</body>

</html>
