<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background: #f4f6f9;
        }

        .login-card {
            width: 420px;
            border: none;
            border-radius: 12px;
        }

        .login-title {
            color: #0d6efd;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">

        <div class="col-auto">

            <div class="card login-card shadow">

                <div class="card-body p-5">


                    <!-- Title -->

                    <div class="text-center mb-4">

                        <h2 class="login-title">
                            ForgeHub
                        </h2>

                        <p class="text-muted">
                            Login to your account
                        </p>

                    </div>


                    <!-- Error -->

                    <div
                            class="alert alert-danger"
                            th:if="${errorMessage}"
                            th:text="${errorMessage}">
                    </div>


                    <!-- Login Form -->

                    <form
                            th:action="@{/auth/login}"
                            th:object="${loginRequestDTO}"
                            method="post">


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                    for="email"
                                    class="form-label">

                                Email

                            </label>

                            <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    placeholder="Enter email"
                                    required>

                        </div>


                        <!-- Password -->

                        <div class="mb-4">

                            <label
                                    for="password"
                                    class="form-label">

                                Password

                            </label>

                            <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    th:field="*{password}"
                                    placeholder="Enter password"
                                    required>

                        </div>


                        <!-- Login -->

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Login

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
