<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Vendor Quotations</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">


    <!-- Custom CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- =====================================================
     ADMIN SIDEBAR
===================================================== -->

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">


    <div class="container-fluid py-4">


        <!-- HEADER -->

        <div class="d-flex justify-content-between
                    align-items-center mb-4">

            <div>

                <h2 class="fw-bold">

                    Vendor Quotations

                </h2>

                <p class="text-muted mb-0">

                    Review and approve vendor quotations

                </p>

            </div>


            <a
                    th:href="@{/admin/dashboard}"
                    class="btn btn-secondary">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

        </div>


        <!-- APPROVED MESSAGE -->

        <div
                th:if="${approved == true}"
                class="alert alert-success alert-dismissible fade show">

            <i class="bi bi-check-circle-fill"></i>

            <strong>Success!</strong>

            Quotation approved successfully.

            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- REJECTED MESSAGE -->

        <div
                th:if="${rejected == true}"
                class="alert alert-warning alert-dismissible fade show">

            <i class="bi bi-exclamation-triangle-fill"></i>

            <strong>Quotation Rejected!</strong>

            Quotation rejected successfully.

            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- =================================================
             QUOTATION TABLE
        ================================================== -->

        <div class="card shadow-sm border-0">


            <div class="card-body">


                <div class="table-responsive">


                    <table class="table table-bordered
                                  table-hover align-middle mb-0">


                        <thead class="table-dark">

                        <tr>

                            <th>#</th>

                            <th>Bid No</th>

                            <th>RFT ID</th>

                            <th>Vendor</th>

                            <th>Company</th>

                            <th>Delivery Date</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                        </thead>


                        <tbody>


                        <tr
                                th:each="quotation, stat :
                                ${quotations}">


                            <td
                                    th:text="${stat.count}">
                            </td>


                            <td>

                                <strong
                                        th:text="${quotation.bidNo}">
                                </strong>

                            </td>


                            <td
                                    th:text="${quotation.rftId}">
                            </td>


                            <td
                                    th:text="${quotation.vendorName}">
                            </td>


                            <td
                                    th:text="${quotation.companyName}">
                            </td>


                            <td
                                    th:text="${quotation.deliveryDate}">
                            </td>


                            <!-- STATUS -->

                            <td>


                                <!-- SUBMITTED -->

                                <span
                                        class="badge bg-warning text-dark"
                                        th:if="${quotation.status == 'SUBMITTED'}">

                                    SUBMITTED

                                </span>


                                <!-- APPROVED -->

                                <span
                                        class="badge bg-success"
                                        th:if="${quotation.status == 'APPROVED'}">

                                    APPROVED

                                </span>


                                <!-- REJECTED -->

                                <span
                                        class="badge bg-danger"
                                        th:if="${quotation.status == 'REJECTED'}">

                                    REJECTED

                                </span>


                            </td>


                            <!-- ACTION -->

                            <td>


                                <!-- APPROVE + REJECT -->

                                <div
                                        th:if="${quotation.status == 'SUBMITTED'}"
                                        class="d-flex gap-2">


                                    <!-- APPROVE -->

                                    <form
                                            th:action="@{/admin/quotations/{id}/approve(id=${quotation.quotationId})}"
                                            method="post">


                                        <button
                                                type="submit"
                                                class="btn btn-sm btn-success"
                                                onclick="return confirm('Approve this quotation?');">

                                            <i class="bi bi-check-circle"></i>

                                            Approve

                                        </button>


                                    </form>


                                    <!-- REJECT -->

                                    <form
                                            th:action="@{/admin/quotations/{id}/reject(id=${quotation.quotationId})}"
                                            method="post">


                                        <button
                                                type="submit"
                                                class="btn btn-sm btn-danger"
                                                onclick="return confirm('Reject this quotation?');">

                                            <i class="bi bi-x-circle"></i>

                                            Reject

                                        </button>


                                    </form>


                                </div>


                                <!-- APPROVED -->

                                <span
                                        th:if="${quotation.status == 'APPROVED'}"
                                        class="text-success fw-semibold">

                                    <i class="bi bi-check-circle-fill"></i>

                                    Approved

                                </span>


                                <!-- REJECTED -->

                                <span
                                        th:if="${quotation.status == 'REJECTED'}"
                                        class="text-danger fw-semibold">

                                    <i class="bi bi-x-circle-fill"></i>

                                    Rejected

                                </span>


                            </td>


                        </tr>


                        <!-- EMPTY -->

                        <tr
                                th:if="${#lists.isEmpty(quotations)}">

                            <td
                                    colspan="8"
                                    class="text-center text-muted py-4">

                                No quotations submitted yet.

                            </td>

                        </tr>


                        </tbody>


                    </table>


                </div>


            </div>


        </div>


    </div>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div th:replace="~{fragments/footer :: footer}">
</div>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
