<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - RFT List</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">


    <!-- =====================================================
         COMMON STYLE
    ====================================================== -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- =====================================================
     ADMIN SIDEBAR
===================================================== -->

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">


    <div class="container-fluid py-4 px-4">


        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div
                class="d-flex
                       justify-content-between
                       align-items-center
                       flex-wrap
                       gap-3
                       mb-4">


            <!-- TITLE -->

            <div>

                <h2 class="fw-bold text-primary mb-1">

                    <i class="bi bi-file-earmark-text me-2"></i>

                    RFT List

                </h2>


                <p class="text-muted mb-0">

                    Manage Request For Quotations

                </p>

            </div>


            <!-- ADD RFT -->

            <a
                    th:href="@{/rft/create}"
                    class="btn btn-primary">

                <i class="bi bi-plus-circle me-1"></i>

                Add RFT

            </a>


        </div>


        <!-- =================================================
             RFT TABLE CARD
        ================================================== -->

        <div class="card shadow-sm border-0">


            <!-- CARD HEADER -->

            <div
                    class="card-header
                           bg-white
                           py-3
                           d-flex
                           justify-content-between
                           align-items-center">


                <h5 class="mb-0 fw-bold">

                    <i class="bi bi-list-ul me-2"></i>

                    Request For Quotations

                </h5>


                <span class="badge bg-primary">

                    Total:
                    <span th:text="${#lists.size(rfts)}">
                        0
                    </span>

                </span>


            </div>


            <!-- CARD BODY -->

            <div class="card-body">


                <!-- =================================================
                     TABLE
                ================================================== -->

                <div class="table-responsive">


                    <table
                            class="table
                                   table-bordered
                                   table-hover
                                   align-middle
                                   mb-0">


                        <!-- TABLE HEADER -->

                        <thead class="table-dark">


                        <tr>


                            <th class="text-center">
                                #
                            </th>


                            <th>
                                RFT No
                            </th>


                            <th>
                                Indent No
                            </th>


                            <th>
                                Description
                            </th>


                            <th>
                                Delivery Location
                            </th>


                            <th>
                                Bid Date
                            </th>


                            <th>
                                Expiry Date
                            </th>


                            <th class="text-center">
                                Status
                            </th>


                            <th class="text-center">
                                Items
                            </th>


                            <th class="text-center">
                                Action
                            </th>


                        </tr>


                        </thead>


                        <!-- =================================================
                             TABLE BODY
                        ================================================== -->

                        <tbody>


                        <!-- RFT DATA -->

                        <tr
                                th:each="rft, stat : ${rfts}">


                            <!-- NUMBER -->

                            <td
                                    class="text-center fw-semibold"
                                    th:text="${stat.count}">

                            </td>


                            <!-- RFT NO -->

                            <td>

                                <span
                                        class="fw-bold text-primary"
                                        th:text="${rft.rftNo}">

                                </span>

                            </td>


                            <!-- INDENT NO -->

                            <td
                                    th:text="${rft.indentNo}">

                            </td>


                            <!-- DESCRIPTION -->

                            <td>

                                <span
                                        th:text="${rft.description}">

                                </span>

                            </td>


                            <!-- DELIVERY LOCATION -->

                            <td>

                                <i
                                        class="bi bi-geo-alt text-danger me-1">
                                </i>

                                <span
                                        th:text="${rft.deliveryLocation}">

                                </span>

                            </td>


                            <!-- BID DATE -->

                            <td>

                                <span
                                        th:if="${rft.bidDate != null}"
                                        th:text="${#temporals.format(
                                            rft.bidDate,
                                            'dd-MM-yyyy HH:mm'
                                        )}">

                                </span>


                                <span
                                        th:unless="${rft.bidDate != null}"
                                        class="text-muted">

                                    -

                                </span>

                            </td>


                            <!-- EXPIRY DATE -->

                            <td>

                                <span
                                        th:if="${rft.expiryDate != null}"
                                        th:text="${#temporals.format(
                                            rft.expiryDate,
                                            'dd-MM-yyyy HH:mm'
                                        )}">

                                </span>


                                <span
                                        th:unless="${rft.expiryDate != null}"
                                        class="text-muted">

                                    -

                                </span>

                            </td>


                            <!-- STATUS -->

                            <td class="text-center">


                                <!-- DRAFT -->

                                <span
                                        th:if="${rft.status == 'DRAFT'}"
                                        class="badge bg-secondary">

                                    <i class="bi bi-file-earmark me-1"></i>

                                    DRAFT

                                </span>


                                <!-- OPEN -->

                                <span
                                        th:if="${rft.status == 'OPEN'}"
                                        class="badge bg-success">

                                    <i class="bi bi-unlock me-1"></i>

                                    OPEN

                                </span>


                                <!-- CLOSE -->

                                <span
                                        th:if="${rft.status == 'CLOSE'}"
                                        class="badge bg-danger">

                                    <i class="bi bi-lock me-1"></i>

                                    CLOSE

                                </span>


                            </td>


                            <!-- ITEMS -->

                            <td class="text-center">


                                <span
                                        class="badge bg-info text-dark">

                                    <i class="bi bi-box-seam me-1"></i>

                                    <span
                                            th:text="${#lists.size(rft.items)}">

                                        0

                                    </span>

                                </span>


                            </td>


                            <!-- ACTION -->

                            <td>


                                <div
                                        class="d-flex
                                               justify-content-center
                                               gap-1">


                                    <!-- VIEW -->

                                    <a
                                            th:href="@{/rft/view/{id}(id=${rft.rftId})}"
                                            class="btn btn-sm btn-info text-white"
                                            title="View RFT">

                                        <i class="bi bi-eye"></i>

                                    </a>


                                    <!-- EDIT -->

                                    <a
                                            th:href="@{/rft/edit/{id}(id=${rft.rftId})}"
                                            class="btn btn-sm btn-warning"
                                            title="Edit RFT">

                                        <i class="bi bi-pencil"></i>

                                    </a>


                                    <!-- DELETE -->

                                    <a
                                            th:href="@{/rft/delete/{id}(id=${rft.rftId})}"
                                            class="btn btn-sm btn-danger"
                                            title="Delete RFT"
                                            onclick="return confirm('Are you sure you want to delete this RFT?');">

                                        <i class="bi bi-trash"></i>

                                    </a>


                                </div>


                            </td>


                        </tr>


                        <!-- =================================================
                             NO DATA
                        ================================================== -->

                        <tr
                                th:if="${#lists.isEmpty(rfts)}">


                            <td
                                    colspan="10"
                                    class="text-center py-5">


                                <div class="text-muted">


                                    <i
                                            class="bi bi-inbox fs-1 d-block mb-3">
                                    </i>


                                    <h5>

                                        No RFT Found

                                    </h5>


                                    <p class="mb-3">

                                        There are no Request For Quotations
                                        available.

                                    </p>


                                    <a
                                            th:href="@{/rft/create}"
                                            class="btn btn-primary">

                                        <i
                                                class="bi bi-plus-circle me-1">
                                        </i>

                                        Create First RFT

                                    </a>


                                </div>


                            </td>


                        </tr>


                        </tbody>


                    </table>


                </div>


            </div>


            <!-- =================================================
                 CARD FOOTER
            ================================================== -->

            <div
                    th:if="${!#lists.isEmpty(rfts)}"
                    class="card-footer bg-white text-muted">


                <small>

                    Showing
                    <strong th:text="${#lists.size(rfts)}">
                        0
                    </strong>
                    RFT(s)

                </small>


            </div>


        </div>


    </div>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div th:replace="~{fragments/footer :: footer}">
</div>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
