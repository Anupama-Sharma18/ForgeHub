<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Recover 2FA</title>


    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">


                    <!-- ===================================== -->
                    <!-- HEADER -->

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Recover Your 2FA
                        </h2>

                    </div>

                    <!-- ===================================== -->
                    <!-- ERROR -->
                    <!-- ===================================== -->

                    <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                            role="alert">
                    </div>


                    <!-- ===================================== -->
                    <!-- SUCCESS -->
                    <!-- ===================================== -->

                    <div
                            id="successMessage"
                            class="alert alert-success d-none"
                            role="alert">
                    </div>


                    <!-- ===================================== -->
                    <!-- EMAIL FORM -->
                    <!-- ===================================== -->

                    <form id="recoveryEmailForm">


                        <!-- Email -->
                        <div class="mb-3">

                            <label
                                    for="email"
                                    class="form-label fw-semibold">

                                Registered Email

                            </label>

                            <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your registered email"
                                    autocomplete="email"
                                    required>

                            <div class="form-text">
                                Enter the same email you use to login.
                            </div>

                        </div>


                        <!-- Send OTP Button -->
                        <div class="d-grid">

                            <button
                                    type="submit"
                                    id="sendOtpButton"
                                    class="btn btn-primary btn-lg">

                                Send Email OTP

                            </button>

                        </div>

                    </form>


                    <!-- ===================================== -->
                    <!-- BACK TO 2FA -->
                    <!-- ===================================== -->

                    <div class="text-center mt-4">

                        <a
                                th:href="@{/2fa}"
                                class="text-decoration-none">

                            ← Back to 2FA

                        </a>

                    </div>


                    <!-- ===================================== -->
                    <!-- BACK TO LOGIN -->
                    <!-- ===================================== -->

                    <div class="text-center mt-2">

                        <a
                                th:href="@{/login}"
                                class="text-decoration-none text-muted">

                            Back to Login

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Recovery Email JS -->
<script
        th:src="@{/js/recovery-email.js}">
</script>


</body>

</html>
