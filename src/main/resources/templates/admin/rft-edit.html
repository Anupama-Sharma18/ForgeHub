<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ForgeHub - Edit RFT</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">


    <!-- =====================================================
         COMMON CSS
    ====================================================== -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">


    <style>

        /* =====================================================
           MAIN CONTENT
        ====================================================== */

        .main-content {
            margin-left: 260px;
            min-height: calc(100vh - 60px);
        }


        /* =====================================================
           PAGE HEADER
        ====================================================== */

        .page-header {
            margin-bottom: 25px;
        }


        .page-title {
            font-weight: 700;
            color: #212529;
        }


        .page-subtitle {
            color: #6c757d;
            margin-bottom: 0;
        }


        /* =====================================================
           CARD
        ====================================================== */

        .form-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }


        .form-card-header {
            background: #0d6efd;
            color: white;
            padding: 20px 25px;
        }


        .form-card-body {
            padding: 30px;
        }


        /* =====================================================
           SECTION
        ====================================================== */

        .section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
        }


        .section-title i {
            color: #0d6efd;
            margin-right: 8px;
        }


        /* =====================================================
           LABEL
        ====================================================== */

        .form-label {
            font-weight: 600;
            color: #343a40;
        }


        /* =====================================================
           INPUT
        ====================================================== */

        .form-control,
        .form-select {

            min-height: 45px;

            border-radius: 7px;

            border: 1px solid #ced4da;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #86b7fe;

            box-shadow:
                    0 0 0 0.20rem
                    rgba(13, 110, 253, 0.15);

        }


        textarea.form-control {
            min-height: 120px;
        }


        /* =====================================================
           READ ONLY INFORMATION
        ====================================================== */

        .readonly-box {

            background-color: #f8f9fa;

            color: #495057;

            cursor: not-allowed;

        }


        /* =====================================================
           RFT INFORMATION BOX
        ====================================================== */

        .rft-info-box {

            background: #f8f9fa;

            border: 1px solid #e9ecef;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 30px;

        }


        /* =====================================================
           FORM FOOTER
        ====================================================== */

        .form-footer {

            border-top: 1px solid #dee2e6;

            margin-top: 30px;

            padding-top: 25px;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 768px) {

            .main-content {
                margin-left: 0;
            }

            .form-card-body {
                padding: 20px;
            }

        }

    </style>

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}">
</div>


<!-- =====================================================
     ADMIN SIDEBAR
===================================================== -->

<div th:replace="~{fragments/admin-sidebar :: adminSidebar}">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="main-content">


    <div class="container-fluid py-4 px-4">


        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div class="page-header">


            <div class="d-flex
                        justify-content-between
                        align-items-center
                        flex-wrap
                        gap-3">


                <div>

                    <h2 class="page-title mb-1">

                        <i class="bi bi-pencil-square text-primary"></i>

                        Edit Request For Quotation

                    </h2>


                    <p class="page-subtitle">

                        Update the RFT information and save your changes.

                    </p>

                </div>


                <!-- BACK -->

                <a
                        th:href="@{/rft/list}"
                        class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Back to RFT List

                </a>


            </div>

        </div>


        <!-- =================================================
             ERROR MESSAGE
        ================================================== -->

        <div
                th:if="${errorMessage}"
                class="alert alert-danger
                       alert-dismissible
                       fade show
                       shadow-sm">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>

            <strong>Error!</strong>

            <span th:text="${errorMessage}">
            </span>


            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>


        <!-- =================================================
             FORM CARD
        ================================================== -->

        <div class="card form-card shadow-sm">


            <!-- CARD HEADER -->

            <div class="form-card-header">

                <h5 class="mb-1 fw-bold">

                    <i class="bi bi-file-earmark-text me-2"></i>

                    RFT Details

                </h5>


                <small>

                    Update the details of this Request For Quotation.

                </small>

            </div>


            <!-- CARD BODY -->

            <div class="form-card-body">


                <!-- =================================================
                     RFT IDENTIFICATION
                ================================================== -->

                <div class="rft-info-box">


                    <h6 class="section-title mb-3">

                        <i class="bi bi-info-circle"></i>

                        RFT Identification

                    </h6>


                    <div class="row g-4">


                        <!-- RFT NUMBER -->

                        <div class="col-md-6">

                            <label
                                    class="form-label"
                                    for="rftNo">

                                RFT Number

                            </label>


                            <input
                                    type="text"
                                    id="rftNo"
                                    class="form-control readonly-box"
                                    th:value="${rft.rftNo}"
                                    readonly>

                        </div>


                        <!-- INDENT NUMBER -->

                        <div class="col-md-6">

                            <label
                                    class="form-label"
                                    for="indentNo">

                                Indent Number

                            </label>


                            <input
                                    type="text"
                                    id="indentNo"
                                    class="form-control readonly-box"
                                    th:value="${rft.indentNo}"
                                    readonly>

                        </div>


                    </div>

                </div>


                <!-- =================================================
                     UPDATE FORM
                ================================================== -->

                <form
                        th:action="@{/rft/update/{id}(id=${rft.rftId})}"
                        method="post">


                    <!-- =================================================
                         GENERAL INFORMATION
                    ================================================== -->

                    <div class="mb-4">


                        <h6 class="section-title">

                            <i class="bi bi-file-text"></i>

                            General Information

                        </h6>


                        <div class="row g-4">


                            <!-- DESCRIPTION -->

                            <div class="col-md-12">

                                <label
                                        for="description"
                                        class="form-label">

                                    Description

                                    <span class="text-danger">
                                        *
                                    </span>

                                </label>


                                <textarea
                                        id="description"
                                        name="description"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Enter RFT description"
                                        required
                                        th:text="${rft.description}">
                                </textarea>

                            </div>


                            <!-- DELIVERY LOCATION -->

                            <div class="col-md-12">

                                <label
                                        for="deliveryLocation"
                                        class="form-label">

                                    Delivery Location

                                    <span class="text-danger">
                                        *
                                    </span>

                                </label>


                                <input
                                        type="text"
                                        id="deliveryLocation"
                                        name="deliveryLocation"
                                        class="form-control"
                                        th:value="${rft.deliveryLocation}"
                                        placeholder="Enter delivery location"
                                        required>

                            </div>


                        </div>

                    </div>


                    <!-- =================================================
                         DATE INFORMATION
                    ================================================== -->

                    <div class="mb-4">


                        <h6 class="section-title">

                            <i class="bi bi-calendar-event"></i>

                            RFT Dates

                        </h6>


                        <div class="row g-4">


                            <!-- BID DATE -->

                            <div class="col-md-6">

                                <label
                                        for="bidDate"
                                        class="form-label">

                                    Bid Date

                                </label>


                                <input
                                        type="datetime-local"
                                        id="bidDate"
                                        name="bidDate"
                                        class="form-control"
                                        th:value="${rft.bidDate != null ? #temporals.format(rft.bidDate, 'yyyy-MM-dd''T''HH:mm') : ''}">

                            </div>


                            <!-- EXPIRY DATE -->

                            <div class="col-md-6">

                                <label
                                        for="expiryDate"
                                        class="form-label">

                                    Expiry Date

                                </label>


                                <input
                                        type="datetime-local"
                                        id="expiryDate"
                                        name="expiryDate"
                                        class="form-control"
                                        th:value="${rft.expiryDate != null ? #temporals.format(rft.expiryDate, 'yyyy-MM-dd''T''HH:mm') : ''}">

                            </div>


                        </div>

                    </div>


                    <!-- =================================================
                         STATUS
                    ================================================== -->

                    <div class="mb-4">


                        <h6 class="section-title">

                            <i class="bi bi-toggle-on"></i>

                            RFT Status

                        </h6>


                        <div class="row">


                            <div class="col-md-6">

                                <label
                                        for="status"
                                        class="form-label">

                                    Status

                                </label>


                                <select
                                        id="status"
                                        name="status"
                                        class="form-select">


                                    <option
                                            value="DRAFT"
                                            th:selected="${rft.status == 'DRAFT'}">

                                        DRAFT

                                    </option>


                                    <option
                                            value="OPEN"
                                            th:selected="${rft.status == 'OPEN'}">

                                        OPEN

                                    </option>


                                    <option
                                            value="CLOSE"
                                            th:selected="${rft.status == 'CLOSE'}">

                                        CLOSE

                                    </option>


                                </select>


                                <div class="form-text">

                                    Select the current status of the RFT.

                                </div>

                            </div>


                        </div>

                    </div>


                    <!-- =================================================
                         FORM FOOTER
                    ================================================== -->

                    <div
                            class="form-footer
                                   d-flex
                                   justify-content-end
                                   gap-2
                                   flex-wrap">


                        <!-- CANCEL -->

                        <a
                                th:href="@{/rft/list}"
                                class="btn btn-outline-secondary">

                            <i class="bi bi-x-circle"></i>

                            Cancel

                        </a>


                        <!-- UPDATE -->

                        <button
                                type="submit"
                                class="btn btn-primary px-4">

                            <i class="bi bi-check-circle"></i>

                            Update RFT

                        </button>


                    </div>


                </form>


            </div>

        </div>


    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div th:replace="~{fragments/footer :: footer}">
</div>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
